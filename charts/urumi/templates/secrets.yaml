{{- $r := . }}
apiVersion: v1
kind: Secret
metadata:
  name: urumi-generated
  namespace: {{ .Release.Namespace }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "mariadb-root-password" "mariadb-password" "wp-admin-password" "woo-consumer-key" "woo-consumer-secret" "woo-mcp-token" "notes-mcp-token" "postgres-password" "master-key" "gateway-admin-password" }}
  {{ $key }}: {{ include "urumi.secret" (dict "root" $r "key" $key) }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-credentials
  namespace: {{ .Values.namespaces.store }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "mariadb-root-password" "mariadb-password" "wp-admin-password" "woo-consumer-key" "woo-consumer-secret" }}
  {{ $key }}: {{ include "urumi.secret" (dict "root" $r "key" $key) }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-credentials
  namespace: {{ .Values.namespaces.mcp }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "woo-consumer-key" "woo-consumer-secret" "woo-mcp-token" "notes-mcp-token" }}
  {{ $key }}: {{ include "urumi.secret" (dict "root" $r "key" $key) }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-credentials
  namespace: {{ .Release.Namespace }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "woo-mcp-token" "notes-mcp-token" "postgres-password" "gateway-admin-password" "master-key" }}
  {{ $key }}: {{ include "urumi.secret" (dict "root" $r "key" $key) }}
  {{- end }}
  database-url: {{ printf "postgres://gateway:%s@postgres.%s.svc.cluster.local:5432/gateway" (index .Values._secrets "postgres-password") .Release.Namespace | b64enc }}
