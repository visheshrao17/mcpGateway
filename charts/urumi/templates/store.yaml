{{- $ns := .Values.namespaces.store }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  selector: { app: mariadb }
  ports: [{ name: mysql, port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: { app: mariadb }
  template:
    metadata:
      labels: { app: mariadb, app.kubernetes.io/part-of: urumi }
    spec:
      securityContext: {{- include "urumi.podSecurity" 999 | nindent 8 }}
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MARIADB_DATABASE, value: wordpress }
            - { name: MARIADB_USER, value: wordpress }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: store-credentials, key: mariadb-password } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: store-credentials, key: mariadb-root-password } }
          securityContext: {{- include "urumi.restricted" . | nindent 12 }}
          startupProbe:
            exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: [healthcheck.sh, --connect] }
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: run, mountPath: /run/mysqld }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "urumi.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- include "urumi.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.store.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  selector: { app: wordpress }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: wordpress }
  template:
    metadata:
      labels: { app: wordpress, app.kubernetes.io/part-of: urumi }
    spec:
      initContainers:
        # The image only copies WordPress into an empty volume. Sync core files whenever the image
        # version differs so the image tag decides the core version; wp-content and wp-config.php stay.
        - name: sync-core
          image: {{ .Values.store.wordpressImage }}
          command:
            - sh
            - -c
            - |
              if ! cmp -s /usr/src/wordpress/wp-includes/version.php /var/www/html/wp-includes/version.php; then
                echo "syncing WordPress core from image"
                tar -C /usr/src/wordpress --exclude=./wp-content -cf - . | tar -C /var/www/html -xf -
              fi
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: html, mountPath: /var/www/html }
      containers:
        - name: wordpress
          image: {{ .Values.store.wordpressImage }}
          ports: [{ containerPort: 80 }]
          env:
            - { name: WORDPRESS_DB_HOST, value: mariadb }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: store-credentials, key: mariadb-password } }
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', '{{ include "urumi.scheme" . }}://{{ include "urumi.storeHost" . }}');
                define('WP_SITEURL', '{{ include "urumi.scheme" . }}://{{ include "urumi.storeHost" . }}');
                if (($_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $_SERVER['HTTPS'] = 'on'; }
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet: { path: /wp-includes/images/blank.gif, port: 80 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /wp-login.php, port: 80 }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /wp-includes/images/blank.gif, port: 80 }
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {{- toYaml .Values.store.resources | nindent 12 }}
          volumeMounts:
            - { name: html, mountPath: /var/www/html }
      volumes:
        - name: html
          persistentVolumeClaim: { claimName: wordpress }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: {{ $ns }}
  labels: {{- include "urumi.labels" . | nindent 4 }}
  {{- if .Values.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts: [{{ include "urumi.storeHost" . }}]
      secretName: storefront-tls
  {{- end }}
  rules:
    - host: {{ include "urumi.storeHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: wordpress, port: { number: 80 } }
